name: Release

# Publishes to npm with provenance, then refreshes the plugin index on Pages.
#
# Auth: npm trusted publishing (OIDC). No npm token is stored in this repository.
# The trusted publisher is configured in the package's settings on npmjs.com with
# workflow `release.yml` and environment `npm`; the job below must run in that
# environment for npm to accept it. The environment requires a reviewer's approval.
#
# Run it by hand (Actions -> Release -> Run workflow) to rehearse: with dry_run
# on, everything runs except the upload.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack only; upload nothing
        type: boolean
        default: true
      index_only:
        description: Skip publishing and only rebuild the plugin index
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.index_only != true
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          elif [ "$REF_TYPE" != "tag" ]; then
            echo "A real publish must run from a v* tag." >&2
            exit 1
          else
            npm publish
          fi

  index:
    needs: publish
    # Runs after a real publish, or alone when index_only is set.
    if: ${{ !cancelled() && (needs.publish.result == 'success' && inputs.dry_run != true || inputs.index_only == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Build the plugin index
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/build-index.mjs --out site/index.json --expect "$(node -p "require('./package.json').version")"
          else
            node scripts/build-index.mjs --out site/index.json
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
